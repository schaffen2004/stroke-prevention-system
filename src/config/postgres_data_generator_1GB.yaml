  vital_signs:
    count: volume
    share: 0.28
    row_bytes: 90
    fallback_multiplier: 12
    uuid_prefix: 4
    primary_key: vital_id
    duplicate: true
    columns:
      vital_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
      measured_at:
        type: datetime
      heart_rate:
        type: int
        min: 55
        max: 120
      spo2:
        type: float
        min: 92
        max: 100
        precision: 2
      temperature:
        type: float
        min: 35.5
        max: 38.5
