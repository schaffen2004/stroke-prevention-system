  physical_activities:
    count: volume
    share: 0.20
    row_bytes: 130
    fallback_multiplier: 6
    uuid_prefix: 6
    primary_key: activity_id
    duplicate: true
    columns:
      activity_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
      activity_time:
        type: datetime
      duration_minutes:
        type: int
        min: 10
        max: 180
      calories:
        type: computed_float
        source: duration_minutes
        min_factor: 3.0
        max_factor: 12.0
        precision: 2
      distance_km:
        type: computed_float
        source: duration_minutes
        min_factor: 2.0
        max_factor: 14.0
        divisor: 60
        precision: 3
      activity_type:
        type: category
        values:
          - "walking"
          - "running"
          - "cycling"
          - "swimming"
          - "gym"
          - "yoga"
          - "football"
          - "other"
