generation:
  demographic_count: 500000
  start_time: "2023-01-01T00:00:00"
  end_time: "2025-12-31T23:59:59"
  volume:
    value: 1
    unit: "GB"
  duplicated_rate: 0.02
  batch_size: 50000
  seed: 42

tables:
  demographic:
    count: demographic_count
    uuid_prefix: 1
    primary_key: demo_id
    duplicate: false
    columns:
      demo_id:
        type: uuid
      age:
        type: int
        min: 18
        max: 90
      gender:
        type: category
        values: ["male", "female", "other"]
        weights: [0.72, 0.27, 0.01]
        skew: true
      marital_status:
        type: category
        values: ["single", "married", "divorced", "widowed"]
        weights: [0.30, 0.50, 0.13, 0.07]
      location:
        type: category
        values: ["north", "central", "south"]
        weights: [0.50, 0.27, 0.23]
        skew: true
      occupation:
        type: category
        values:
          - "office_worker"
          - "farmer"
          - "engineer"
          - "business"
          - "teacher"
          - "healthcare"
          - "other"
        weights: [0.32, 0.18, 0.15, 0.15, 0.08, 0.06, 0.06]
      residence_type:
        type: category
        values: ["urban", "rural", "suburban"]
        weights: [0.55, 0.30, 0.15]
        skew: true
      income_level:
        type: category
        values: ["low", "middle", "high"]
        weights: [0.28, 0.55, 0.17]
        skew: true
      family_history_stroke:
        type: bool
        probability: 0.12
      family_history_cvd:
        type: bool
        probability: 0.18

  ehr:
    count: volume
    share: 0.26
    row_bytes: 150
    fallback_multiplier: 4
    uuid_prefix: 2
    primary_key: ehr_id
    duplicate: true
    columns:
      ehr_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
      encounter_date:
        type: datetime
      height_cm:
        type: float
        min: 140
        max: 200
        precision: 2
      weight_kg:
        type: float
        min: 40
        max: 150
        precision: 2
      is_diabetes:
        type: bool
        probability: 0.12
      is_heart_disease:
        type: bool
        probability: 0.08
      is_kidney_disease:
        type: bool
        probability: 0.05
      fasting_glucose:
        type: float
        min: 70
        max: 115
        precision: 2
        when:
          is_diabetes:
            min: 126
            max: 250
      hba1c:
        type: float
        min: 4.2
        max: 6.0
        precision: 2
        when:
          is_diabetes:
            min: 6.5
            max: 11.0
      total_cholesterol:
        type: float
        min: 120
        max: 260
        precision: 2
      ldl:
        type: float
        min: 50
        max: 190
        precision: 2
      hdl:
        type: float
        min: 30
        max: 80
        precision: 2

  lifestyle:
    count: volume
    share: 0.08
    row_bytes: 120
    fallback_multiplier: 2
    uuid_prefix: 3
    primary_key: lifestyle_id
    duplicate: true
    columns:
      lifestyle_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
      recorded_at:
        type: datetime
      smoking:
        type: category
        values: [false, true]
        weights: [0.78, 0.22]
      alcohol_consumption_frequency:
        type: int
        min: 0
        max: 30
      cooking_method:
        type: category
        values: ["fried_stir_fried", "grilled", "boiled", "steamed"]
