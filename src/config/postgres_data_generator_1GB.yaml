      diet_taste_preference:
        type: category
        values: ["salty", "spicy", "sour", "bitter", "sweet", "moderate"]
        weights: [0.35, 0.20, 0.10, 0.05, 0.15, 0.15]
      diet_type:
        type: category
        values: ["vegetable", "meat", "seafood", "balanced"]
