      sleep_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
      sleep_start:
        type: datetime
      sleep_end:
        type: offset_datetime
        source: sleep_start
        seconds_min: 14400
        seconds_max: 36000
      is_wake_sudden:
