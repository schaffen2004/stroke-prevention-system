  stroke_history:
    count: volume
    share: 0.05
    row_bytes: 80
    fallback_multiplier: 0.05
    uuid_prefix: 7
    primary_key: stroke_id
    duplicate: false
    columns:
      stroke_id:
        type: uuid
      demo_id:
        type: patient
        table: demographic
        mode: round_robin
      stroke_time:
        type: datetime
      stroke_sequence:
        type: sequence
